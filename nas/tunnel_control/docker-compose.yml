# NAS-Ordner: /volume3/docker_v3/tunnel_control
# Fragt tunnel.munot.app ab und startet/stoppt die Container cf-tunnel-<tunnel_id>.
services:
  poller:
    image: python:3.12-alpine
    container_name: tunnel-poller
    restart: unless-stopped
    command: ["python", "-u", "/app/poller.py"]
    environment:
      WORKER_URL: https://tunnel.munot.app
      NAS_TOKEN: ${NAS_TOKEN}
      POLL_SECONDS: "30"
      FAIL_STOP_AFTER: "3"
      TZ: Europe/Zurich
    volumes:
      - ./poller.py:/app/poller.py:ro
      - /var/run/docker.sock:/var/run/docker.sock
