<title>ERP Tunnel Test</title>

<body>
<main>
<h1>ERP Tunnel Test</h1>

<p id="t"></p>
</main>
<script>
document.getElementById('t').textContent = 'Abgerufen: ' + new Date().toLocaleString('de-CH', { timeZone: 'Europe/Zurich' });
</script>
