# NAS-Ordner: /volume3/docker_v3/erp_tunnel
# cf-tunnel-erp: cloudflared fuer den Tunnel 'erp', wird vom Poller gestartet/gestoppt.
#   Der Container-Name MUSS cf-tunnel-<tunnel_id> lauten (tunnel_id aus D1).
# erp-app: ERP-Front-End (Node/Express), laeuft dauerhaft, nur lokal auf 127.0.0.1:13000.
#   Im Tunnel als Public Hostname: erp.munot.app -> http://localhost:13000
services:
  cf-tunnel-erp:
    image: cloudflare/cloudflared:latest
    container_name: cf-tunnel-erp
    # "no": nach einem NAS-Neustart bleibt der Tunnel zu, bis er geoeffnet wird
    restart: "no"
    command: tunnel --no-autoupdate run
    # host: 'localhost' im Tunnel meint das NAS selbst
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

  erp-app:
    build: ./app
    image: munotstadt-erp:latest
    container_name: erp-app
    restart: unless-stopped
    # host: erreicht die DB ueber die NAS-IP, bindet 127.0.0.1 des NAS
    network_mode: host
    env_file: ./erp_app.env
